[package]
name = "grav"
version = "0.5.1"
edition = "2021"
description = "Official standalone CLI for GravSpace Object Storage & Secrets Vault"

[[bin]]
name = "grav"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

